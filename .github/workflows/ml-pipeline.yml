name: ML Training and Parity Plots

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:  # Allow manual trigger
  schedule:
    - cron: '0 0 * * 0'  # Run weekly on Sunday at midnight

jobs:
  train-and-plot:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Create data directory structure
      run: |
        mkdir -p data output
    
    - name: Create sample experimental data
      run: |
        cat > data/experimental_photocatalysis.csv << 'EOF'
        Sample,Crystallite size (nm),Surface area (m2 g^-1),Band gap direct (eV),Band gap indirect (eV),Rate constant (k x 10^-1 / h),Rate of hydrogen evolved (umol (h g.cat)^-1),Quantum yield (%)
        μS 10 min,47,2.3,1.93,1.83,1.390,99.2,0.14
        μS 30 min,35,4.6,1.93,1.83,2.320,133.5,0.19
        μS 150 min,29,5.6,1.93,1.83,0.005,92.2,0.13
        CS,53,2.2,1.90,1.81,2.150,31.7,0.05
        EOF
    
    - name: Train ML models
      run: |
        python train_ml_models.py
    
    - name: Generate parity plots
      run: |
        python generate_parity_plots.py
    
    - name: Upload parity plots
      uses: actions/upload-artifact@v4
      with:
        name: parity-plots
        path: output/*.png
        retention-days: 30
    
    - name: Upload comparison table
      uses: actions/upload-artifact@v4
      with:
        name: comparison-data
        path: output/comparison_table.csv
        retention-days: 30
    
    - name: Upload summary report
      uses: actions/upload-artifact@v4
      with:
        name: summary-report
        path: output/summary_report.txt
        retention-days: 30

  run-50-iterations:
    runs-on: ubuntu-latest
    # Run on push, manual trigger, or weekly schedule
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    
    permissions:
      contents: write
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Configure git
      run: |
        git config --global user.email "krishnakashab@github.com"
        git config --global user.name "krishnakashablalwani"
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Create data directory structure
      run: |
        mkdir -p data output
    
    - name: Create sample experimental data
      run: |
        cat > data/experimental_photocatalysis.csv << 'EOF'
        Sample,Crystallite size (nm),Surface area (m2 g^-1),Band gap direct (eV),Band gap indirect (eV),Rate constant (k x 10^-1 / h),Rate of hydrogen evolved (umol (h g.cat)^-1),Quantum yield (%)
        μS 10 min,47,2.3,1.93,1.83,1.390,99.2,0.14
        μS 30 min,35,4.6,1.93,1.83,2.320,133.5,0.19
        μS 150 min,29,5.6,1.93,1.83,0.005,92.2,0.13
        CS,53,2.2,1.90,1.81,2.150,31.7,0.05
        EOF
    
    - name: Run 50 iterations
      run: |
        python run_n_iterations.py 50
    
    - name: Upload iteration results
      uses: actions/upload-artifact@v4
      with:
        name: ml-iterations-results
        path: output/ml_iterations_*.xlsx
        retention-days: 90
